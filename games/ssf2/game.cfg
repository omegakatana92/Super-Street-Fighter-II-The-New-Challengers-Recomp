# Super Street Fighter II: The New Challengers (Capcom 1993, CPS-2 arcade board): per-game settings
# read by the cps2recomp toolkit (Makefile, tools and launcher via cps2recomp/tools/gamecfg.py).

name = Super Street Fighter II
# What the window is called (the name stays the folder the player's settings are kept under)
title = Super Street Fighter II Recomp
id = ssf2
# Reverse-DNS app identifier (macOS bundle id / launcher).
app_id = io.github.omegakatana92.ssf2
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# `ssf2` is MAME's parent set (World 931005); its clones (ssf2r1, ssf2u, ssf2a, ssf2ar1, ssf2j, ssf2jr1,
# ssf2h, ssf2b, ssf2us2) are built from the same board and are not accepted here.
rom_set = ssf2
rom_parent = ssf2
rom_name = Super Street Fighter II: The New Challengers (World 931005)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words, five 512 KiB files: 2.5 MiB). graphics: four files side by
# side per row (64-bit words), a 2 MiB row then a 1 MiB one (12 MiB in all): ssf.13m/15m/17m/19m, then
# ssf.14m/16m/18m/20m. sound_program: the Z80's ROM (ssf-01a, 128 KiB: 32 KiB fixed, six 16 KiB banks).
# samples: the QSound chip's (ssf.q01..ssf.q08, 4 MiB). key: the board's cipher key.
program = ssfe-03b:af654792 ssfe.04:b082aa67 ssfe.05:02b9c137 ssfe-06b:1c8e44a8 ssfe.07:2409001d
graphics = ssf.13m:cf94d275 ssf.15m:5eb703af ssf.17m:ffa60e0f ssf.19m:34e825c5 ssf.14m:b7cc32e7 ssf.16m:8376ad18 ssf.18m:f5b1b336 ssf.20m:459d5c6b
sound_program = ssf-01a:71fcdfc9
samples = ssf.q01:a6f9da5c ssf.q02:8c66ae26 ssf.q03:695cc2ca ssf.q04:9d9ebe32 ssf.q05:4770e7b7 ssf.q06:4e79c951 ssf.q07:cdd14313 ssf.q08:6f5a088c
key = ssf2.key:e469ccbb

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this. The
# maincpu region is 4 MiB (as on the board), but only five 512 KiB ROMs are populated, so the program
# the port translates spans 2.5 MiB (0x280000).
code_end = 280000
